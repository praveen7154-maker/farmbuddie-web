<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in | Farm Buddie</title>

  <!-- Main CSS -->
  <!-- Start downloading Firebase straight away (it is otherwise found one
       file at a time: page script -> firebase-init.js -> Firebase). -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js">
  <link rel="modulepreload" href="/js/firebase-init.js">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body class="login-body login-page">

  <div class="login-container">

    <!-- LOGO -->
    <img src="/assets/logo.png" alt="Farm Buddie Logo" class="login-logo">

    <h2>Sign in</h2>
    <p class="login-subtitle">Admin: your email &middot; Production team: your username</p>

    <!-- EMAIL (admin) or USERNAME (production team) -->
    <input
      type="text"
      id="email"
      placeholder="Email or username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
    >

    <!-- PASSWORD -->
    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <!-- ERROR MESSAGE -->
    <div id="error-msg" class="error-text" style="display:none;"></div>

    <!-- LOGIN BUTTON -->
    <button class="login-btn" id="loginBtn" type="button">
      Login
    </button>

  </div>

  <!-- Firebase Login Logic (CORRECT VERSION) -->
  <script type="module">
    import { auth } from "/js/firebase-init.js";
    import { signInWithEmailAndPassword, signInWithCustomToken, signOut }
      from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { BRIDGE_BASE_URL } from "/js/config.js";
    import { saveStaffSession, clearStaffSession, saveTeamSession, clearTeamSession } from "/js/production-session.js";

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorMsg = document.getElementById("error-msg");
    const loginBtn = document.getElementById("loginBtn");

    function login() {
      console.log("LOGIN CLICKED");

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      errorMsg.style.display = "none";

      if (!email || !password) {
        errorMsg.textContent = "Please enter your email or username, and the password";
        errorMsg.style.display = "block";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      // No "@": a team member (an account the admin made in User Roles) -
      // checked by our server: the production team goes to the Production
      // module, the onboarding team to Farmer Onboarding.
      if (!email.includes("@")) {
        staffLogin(email, passwordInput.value);
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          console.log("LOGIN SUCCESS:", cred.user.uid);
          clearStaffSession();
          clearTeamSession();
          // Modern view (the default) starts on the module Home page,
          // Classic on the Dashboard as before - see /js/admin-shell.js.
          let view = null;
          try { view = localStorage.getItem("fb.view"); } catch (e) { /* private mode */ }
          window.location.href = view === "classic" ? "/admin/index.html" : "/admin/home.html";
        })
        .catch((error) => {
          console.error("LOGIN ERROR:", error);
          errorMsg.textContent = error.message;
          errorMsg.style.display = "block";
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        });
    }

    async function staffLogin(username, password) {
      try {
        await signOut(auth).catch(() => {});   // an admin session left on this browser ends first
        const r = await fetch(`${BRIDGE_BASE_URL}/production/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.error || "Sign-in failed - try again");
        if (body.kind === "firebase") {
          // The onboarding team: a Firebase sign-in our server made for them.
          clearStaffSession();
          await signInWithCustomToken(auth, body.customToken);
          saveTeamSession(body);
          window.location.href = "/admin/farmer-onboarding.html";
          return;
        }
        clearTeamSession();
        saveStaffSession(body);
        window.location.href = "/admin/production.html";
      } catch (err) {
        errorMsg.textContent = err.message === "Failed to fetch" ? "Can't reach the server - check the internet connection" : err.message;
        errorMsg.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    }

    loginBtn.addEventListener("click", login);
    [emailInput, passwordInput].forEach((el) => el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    }));
  </script>

</body>
</html>
