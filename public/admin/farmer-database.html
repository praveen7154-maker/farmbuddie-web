<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmer Database | Farm Buddie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
 <!-- ✅ Favicon -->
  <link rel="icon" href="/assets/logo_icon.png" type="image/png">
  <link rel="shortcut icon" href="/assets/logo_icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/logo_icon.png">

  <!-- GLOBAL -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin-sidebar.css">
  <link rel="stylesheet" href="/css/admin-tables.css">
  

</head>

<body class="fb-layout">

<!-- ================= SIDEBAR ================= -->
<aside class="fb-sidebar">
  <div class="fb-brand">
    <img src="/assets/logo.png" alt="Farm Buddie Logo">
  </div>

   <nav class="fb-menu">
    <a href="/admin/index.html">📊 Dashboard</a>
    <a href="/admin/farmer-onboarding.html">🧑‍🌾 Farmer Onboarding</a>
    <a class="active" href="/admin/farmer-database.html">📋 Farmer Database</a>
    <a href="/admin/controller-database.html">🧠 MCU / Controller</a>
    <!--<a href="/admin/phone-auth.html">📱 Phone Authentication</a>-->
    <a href="/admin/analytics.html">📈 Analytics</a>
    <a href="/admin/distributor-database.html">🏢 Distributor Database</a>
    <a href="/admin/hr/hrconnect.html">👥 HR Connect</a>
    <a href="#" id="logoutBtn" class="logout">🚪 Logout</a>
  </nav>
</aside>

<!-- ================= MAIN ================= -->
<main class="fb-main">

<header class="fb-topbar">
  <h1>📋 Farmer Database</h1>
  <span class="fb-user">Admin</span>
</header>

<div class="top-actions">
  <button class="fb-btn-primary small" onclick="downloadAllFarmersExcel()">
    ⬇ Download (Excel)
  </button> 

   <input 
    type="text" 
    id="searchInput" 
    placeholder="Search by Farm Buddie ID">

</div>

<!-- TABLE -->
<div class="fb-table-card">
  <table class="fb-table">

    <thead>
      <tr>
        <th>#</th>
        <!-- ✅ FILTER ENABLED -->
        <th>
          <div class="fb-th-wrapper">
            <span class="fb-th-label">Farm Buddie ID</span>
            <span class="fb-filter-icon" data-col="1">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor"
                  d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/>
              </svg>
            </span>
            <div class="fb-filter-dropdown"></div>
          </div>
        </th>

        <th>Farmer Name</th>
        <th>Distributor ID</th>


        <th><div class="fb-th-wrapper">
            <span class="fb-th-label">Farm Badge</span>
            <span class="fb-filter-icon" data-col="4">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor"
                  d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/>
              </svg>
            </span>
            <div class="fb-filter-dropdown"></div>
          </div></th>


        <!-- ✅ FILTER ENABLED -->
        <th>
          <div class="fb-th-wrapper">
            <span class="fb-th-label">Mobile</span>
            <span class="fb-filter-icon" data-col="5">
              <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor"
                  d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/>
              </svg>
            </span>
            <div class="fb-filter-dropdown"></div>
          </div>
        </th>

        <th>Status</th>
        <th>Action</th>

      </tr>
    </thead>

    <tbody id="farmerTableBody"></tbody>
  </table>
</div>

<!-- ✅ Pagination -->
<div class="fb-table-pagination">
  <div class="fb-page-info">
    Showing <span id="fbStart">0</span> to 
    <span id="fbEnd">0</span> of 
    <span id="fbTotal">0</span> entries
  </div>
  <div class="fb-pagination-controls" id="fbPagination"></div>
</div>
</main>

<!-- Excel Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- Your Database JS -->
<script type="module" src="/js/farmer-database.js"></script>
<script src="/js/table-pagination.js"></script>
</body>
</html>
