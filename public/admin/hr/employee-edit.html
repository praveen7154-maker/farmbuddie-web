<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee | Farm Buddie</title>

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin-sidebar.css">
  <link rel="stylesheet" href="/css/hr/hr-pages.css">
</head>

<body class="fb-layout">

<!-- ================= SIDEBAR ================= -->
<aside class="fb-sidebar">
  <div class="fb-brand">
    <img src="/assets/logo.png" alt="Farm Buddie Logo">
  </div>

  <nav class="fb-menu">
    <a href="/admin/index.html">📊 Dashboard</a>
    <a href="/admin/farmer-onboarding.html">🧑‍🌾 Farmer Onboarding</a>
    <a href="/admin/farmer-database.html">📋 Farmer Database</a>
    <a href="/admin/controller-database.html">🧠 MCU / Controller</a>
    <a href="/admin/phone-auth.html">📱 Phone Authentication</a>
    <a href="/admin/analytics.html">📈 Analytics</a>
    <a href="/admin/distributor-database.html">🏢 Distributor Database</a>
    <a class="active" href="/admin/hr/hrconnect.html">👥 HR Connect</a>
    <a href="#" id="logoutBtn" class="logout">🚪 Logout</a>
  </nav>
</aside>

<!-- ================= MAIN ================= -->
<main class="fb-main">

<header class="fb-topbar">
  <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
    <h1>✏️ Edit Employee</h1>
    <button class="hr-back-btn" onclick="goBackHR()">← Back</button>
  </div>
</header>

<div class="hr-page-content">

  <!-- ================= BASIC DETAILS ================= -->
  <div class="hr-card">

    <h3 class="hr-section-title">Basic Information</h3>

    <div class="hr-form-grid">

      <!-- 🔥 Employee ID (Read Only) -->
      <div class="hr-field">
        <label>Employee ID</label>
        <input type="text" id="empId" readonly>
      </div>

      <div class="hr-field">
        <label>Full Name *</label>
        <input type="text" id="empName">
      </div>

      <div class="hr-field">
        <label>Email *</label>
        <input type="email" id="empEmail">
      </div>

      <div class="hr-field">
        <label>Mobile *</label>
        <input type="text" id="empMobile">
      </div>

      <div class="hr-field">
        <label>Role *</label>
        <select id="empRole">
          <option value="">Select Role</option>
          <option>Admin</option>
          <option>Manager</option>
          <option>Field Executive</option>
          <option>Technician</option>
          <option>HR</option>
        </select>
      </div>

      <div class="hr-field">
        <label>Department *</label>
        <select id="empDepartment">
          <option value="">Select Department</option>
          <option>Operations</option>
          <option>Sales</option>
          <option>HR</option>
          <option>Accounts</option>
          <option>Support</option>
        </select>
      </div>

      <div class="hr-field">
        <label>Joining Date *</label>
        <input type="date" id="empJoiningDate">
      </div>

    </div>

  </div>


  <!-- ================= BANK DETAILS ================= -->
  <div class="hr-card">

    <h3 class="hr-section-title">Bank Account Details</h3>

    <div class="hr-form-grid">

      <div class="hr-field">
        <label>Account Holder Name</label>
        <input type="text" id="bankHolder">
      </div>

      <div class="hr-field">
        <label>Account Number</label>
        <input type="text" id="bankAccountNo">
      </div>

      <div class="hr-field">
        <label>IFSC Code</label>
        <input type="text" id="bankIfsc">
      </div>

      <div class="hr-field">
        <label>Bank Name</label>
        <input type="text" id="bankNameInput">
      </div>

      <div class="hr-field">
        <label>Account Statement</label>
        <input type="file" id="docAccountStatement" accept=".pdf,.jpg,.jpeg">
      </div>

    </div>

  </div>


  <!-- ================= DOCUMENTS ================= -->
  <div class="hr-card">

    <h3 class="hr-section-title">Employee Documents</h3>

    <div class="hr-form-grid">

      <div class="hr-field">
        <label>Aadhaar</label>
        <input type="file" id="docAadhaar" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>PAN</label>
        <input type="file" id="docPan" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Photo</label>
        <input type="file" id="docPhoto" accept=".jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Experience Letter</label>
        <input type="file" id="docExperience" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Degree / Certificate</label>
        <input type="file" id="docDegree" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Last 3 Months Payslip</label>
        <input type="file" id="docPayslip" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Other Document 1</label>
        <input type="file" id="docOther1" accept=".pdf,.jpg,.jpeg">
      </div>

      <div class="hr-field">
        <label>Other Document 2</label>
        <input type="file" id="docOther2" accept=".pdf,.jpg,.jpeg">
      </div>

    </div>

    <!-- 🔥 Existing Documents Preview -->
    <div id="existingDocs" style="margin-top:20px;"></div>

  </div>


  <!-- ================= UPDATE BUTTON ================= -->
  <div class="hr-actions">
    <button class="hr-btn primary" onclick="updateEmployee()">
      Update Employee
    </button>
  </div>

</div>

</main>

<script type="module" src="/admin/hr/hr-common.js"></script>
<script type="module" src="/admin/hr/employee-edit.js"></script>

</body>
</html>
